name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

    - name: Install Cython and Buildozer
      run: |
        python -m pip install --upgrade pip setuptools
        pip install Cython==0.29.36 buildozer

    - name: Build APK with Buildozer
      run: |
        printf 'y\ny\ny\ny\ny\ny\ny\ny\ny\n' | buildozer -v android debug
      env:
        CI: true

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: BARAT-Core-APK
        path: bin/*.apk
        
