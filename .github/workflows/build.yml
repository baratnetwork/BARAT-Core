name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install System Packages
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev build-essential ccache

    - name: Install Correct Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install "Cython<3.0"
        pip install buildozer

    - name: Force Clean Buildozer Cache
      run: |
        rm -rf .buildozer
        rm -rf ~/.buildozer

    - name: Accept SDK Licenses
      run: |
        mkdir -p $HOME/.android
        touch $HOME/.android/repositories.cfg
        yes | sdkmanager --licenses || true

    - name: Build APK
      run: |
        buildozer -v android debug
      env:
        CI: true
        APP_ANDROID_ARCH: arm64-v8a

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: BARAT-Core-APK
        path: bin/*.apk
        
