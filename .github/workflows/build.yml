name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install System Dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev build-essential ccache

    - name: Install Pinned Buildozer and Dependencies
      run: |
        pip install --upgrade pip setuptools wheel
        pip install "Cython==0.29.36"
        pip install "buildozer==1.5.0"
        pip install "git+https://github.com/kivy/python-for-android.git@v2024.01.21"

    - name: Clean Old Cache
      run: |
        sudo rm -rf /usr/local/lib/android/sdk/ndk/*
        rm -rf .buildozer

    - name: Build Android APK
      run: |
        yes | buildozer -v android debug
      env:
        ANDROID_NDK_HOME: ""
        ANDROID_NDK_ROOT: ""
        ANDROID_NDK_LATEST_HOME: ""

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BARAT-Core-APK
        path: bin/*.apk
