name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Free Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf "/usr/local/share/boost"
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev build-essential ccache

    - name: Install Cython and Buildozer
      run: |
        python -m pip install --upgrade pip setuptools
        pip install "Cython==0.29.36" buildozer

    - name: Accept Licenses and Clean Build
      run: |
        mkdir -p $HOME/.android
        touch $HOME/.android/repositories.cfg
        yes | sdkmanager --licenses || true
        rm -rf .buildozer

    - name: Build APK with Buildozer
      run: |
        buildozer -v android debug
      env:
        CI: true
        EXTRA_CLANG_ARGS: "-Wno-error"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: BARAT-Core-APK
        path: bin/*.apk
