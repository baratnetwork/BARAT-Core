name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Free Disk Space & Remove Conflicting NDKs
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf "/usr/local/share/boost"
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"
        sudo rm -rf /usr/local/lib/android/sdk/ndk/*

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev build-essential ccache

    - name: Install Cython and Buildozer
      run: |
        python -m pip install --upgrade pip setuptools
        pip install "Cython<3.0" buildozer

    - name: Clean Buildozer Cache
      run: |
        rm -rf .buildozer
        rm -rf ~/.buildozer

    - name: Compile APK
      run: |
        buildozer -v android debug
      env:
        CI: true
        ANDROID_NDK_HOME: ""
        ANDROID_NDK_ROOT: ""
        ANDROID_NDK_LATEST_HOME: ""

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: BARAT-Core-APK
        path: bin/*.apk
